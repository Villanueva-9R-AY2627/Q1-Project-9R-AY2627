<!DOCTYPE html>
<html lang="en">
<head>
    <title>Intro to Botstrap</title>
    <!--css-->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid bg-danger text-warning text-center p-3">
        <h1>Volleyball Guide 🏐</h1>
    </div>

    <!--ROW 1-->
    <div class="row mt-3">
        <div class="col-4 bg-info p-4">
            <h4>📖 Basic Rules</h4>
            <ul>
                <li>Serve diagonally</li>
                <li>Double bounce rule</li>
                <li>No volley zone</li>
                <li>Scoring</li>
            </ul>
        </div>
        <div class="col-4 bg-warning p-4">
            <h4>🏐 Volleyball Equipment</h4>
            <ul>
                <li>Volleyball</li>
                <li>Net and poles</li>
                <li>Knee pads</li>
                <li>Court</li>
            </ul>
        </div>
        <div class="col-4 bg-primary text-white p-4">
            <h4>🎯 Basic Techniques</h4>
            <ul>
                <li>Forehand and backhand strokes</li>
                <li>Serving techniques</li>
                <li>Dinking</li>
                <li>Positioning</li>
            </ul>
        </div>
    </div>
</body>
</html>
